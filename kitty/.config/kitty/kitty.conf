font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

background #121212
foreground #dcdcdc
# Esto evita que Kitty intente "adivinar" colores de la ventana
dynamic_background_opacity yes

repaint_delay    10
input_delay      3
sync_to_monitor  yes

env PATH=/home/sxiks/.opencode/bin:/usr/local/bin:/usr/bin:/bin:/usr/local/games:/usr/games

shell zellij --layout opencode-workspace

cursor_shape     block
cursor_blink_interval 0

term xterm-kitty
