# ~/dotfiles/apps/manifest.yaml
#
# Fuente única de verdad del estado deseado de APLICACIONES/SOFTWARE INSTALADO.
# La CONFIGURACIÓN (Kitty, Zellij, Yazi, Fish, Starship, etc.) sigue gestionada
# por separado mediante dotfiles + GNU Stow. Este archivo nunca representa
# configuración, solo software instalado.
#
# Este archivo NO se sobrescribe automáticamente: export_apps.sh solo
# propone cambios mediante diff, siempre con confirmación explícita.
#
# scope: common  -> comportamiento por defecto, se aplica a todas las máquinas.
# scope: machine -> excepción explícita, solo aplica a las máquinas listadas.
# state: absent  -> puramente declarativo/informativo (no provoca desinstalación).
# preferred: true -> máximo una entrada por equivalence_id; es la única instalable.
# install_policy: manual -> nunca se instala automáticamente. Se usa tanto para
#                            binarios sin automatización aún resuelta, como para
#                            CUALQUIER entrada preferred:false (duplicada/rota),
#                            y para managers que requieren pasos de seguridad
#                            no automatizados todavía (ej. apt_third_party_repo).
# install_policy: auto   -> candidata a instalación automática por import_apps,
#                            solo si además preferred:true y status:ok.
#
# Decisión 2026-11-11: la META de todo el manifest es install_policy: auto.
# manual es un estado TRANSITORIO: una entrada pasa a auto solo cuando existe
# un instalador real y verificable para ella (nunca antes).
#
# version (managers apt): "última versión observada", solo informativa. Ningún
# script la exige; los paquetes APT se actualizan con apt upgrade.
#
# NOTA: OpenCode queda deliberadamente FUERA de este manifest. Ver
# docs/PENDING_ARCHITECTURE.md (a crear en fase posterior) — versión y hash
# del binario divergen entre PC1 y PC2, no cumple el criterio de
# reproducibilidad usado para el resto de entradas binary.

#
# install_scope: user | system  (NUEVO — C3-G)
#   flatpak -> user o system, según dónde esté realmente instalada la app.
#   apt     -> siempre system (invariante dura).
#   snap    -> siempre system (invariante dura).
#   binary  -> debe coincidir con source.destination (invariante dura):
#              ~/...  -> user
#              /usr/... , /opt/... -> system
#   Una app instalada en cualquiera de los dos scopes (flatpak) cuenta como
#   instalada. import_apps.sh NUNCA mueve una app entre scopes ni la
#   reinstala para "corregir" el scope; solo advierte con [WARN] si el
#   scope real difiere del declarado.

