    preferred: true
    install_policy: auto
    source: {}
    notes: "Instalado inicialmente en PC1 (flatpak --user). Declarado common por decisión explícita (2026-08-14): una app instalada intencionalmente debe poder propagarse. Pendiente instalar en PC2 vía import_apps."

